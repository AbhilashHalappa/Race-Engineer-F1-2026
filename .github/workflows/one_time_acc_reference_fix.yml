name: One-time ACC reference lap fix

on:
  push:
    branches:
      - feature/pedals-handbrake-hardware-integration

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix ACC reference lap anchoring') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pedals-handbrake-hardware-integration
          fetch-depth: 0
      - name: Apply ACC reference anchoring fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/measured_performance.py')
          s = p.read_text(encoding='utf-8')
          old = "'lap_start_anchored':_samples_have_lap_start(a),"
          new = "'lap_start_anchored':bool(self.current_lap_started_clean),"
          if old not in s:
              raise SystemExit('summary anchor target not found')
          s = s.replace(old, new, 1)
          old = "if common and _samples_have_lap_start(ca) and _samples_have_lap_start(ra):"
          new = "if common and (cur.get('lap_start_anchored') or _samples_have_lap_start(ca)) and (ref.get('lap_start_anchored') or _samples_have_lap_start(ra)):"
          if old not in s:
              raise SystemExit('compare anchor target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/measured_performance.py
          git rm .github/workflows/one_time_acc_reference_fix.yml
          git commit -m "Fix ACC reference lap anchoring"
          git push origin feature/pedals-handbrake-hardware-integration
